<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Live Labyrinth</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
                 font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #ddd; }
    #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    .panel { position: fixed; z-index: 10; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #stats { top: 8px; left: 10px; opacity: .8; }
    #queue { top: 26px; left: 10px; color: #ffb861; }
    #hint  { left: 0; right: 0; bottom: 24px; text-align: center; color: #9a9a9a; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px;
                 margin: -1.5px 0 0 -1.5px; background: rgba(255,255,255,.5);
                 border-radius: 50%; z-index: 10; pointer-events: none; }
    #fatal { display: none; position: fixed; inset: 0; z-index: 30; padding: 40px;
             background: #140000; color: #ff8f7a; white-space: pre-wrap; }
    kbd { background: #1b1b1d; border: 1px solid #333; border-bottom-width: 2px;
          border-radius: 3px; padding: 1px 6px; color: #eee; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="stats" class="panel"></div>
<div id="queue" class="panel"></div>
<div id="crosshair"></div>
<div id="hint" class="panel">
    click to look &middot; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &middot;
    <kbd>Shift</kbd> run &middot; <kbd>R</kbd> new world &middot;
    the world is generated around you as you go
</div>
<div id="fatal"></div>
<script type="module" src="./live.js"></script>
</body>
</html>
